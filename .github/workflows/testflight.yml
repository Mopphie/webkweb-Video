name: DevnTube TestFlight (manual)

# A local draft. Dispatch consumes macOS Actions minutes; never dispatch without approval.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'build-only uses no signing secrets and does not upload'
        required: true
        type: choice
        options:
          - build-only
          - upload
        default: build-only
      confirm_upload:
        description: 'For upload mode only, type exactly UPLOAD'
        required: false
        type: string
        default: ''

permissions:
  contents: read
concurrency:
  group: devntube-testflight
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check dispatch intent
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM_UPLOAD: ${{ inputs.confirm_upload }}
        run: |
          set -euo pipefail
          case "$MODE" in
            build-only) test -z "$CONFIRM_UPLOAD" || { echo '::error::Build-only must leave confirmation empty'; exit 1; } ;;
            upload) test "$CONFIRM_UPLOAD" = UPLOAD || { echo '::error::Upload requires exact UPLOAD confirmation'; exit 1; } ;;
            *) echo '::error::Unknown mode'; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install XcodeGen and run Node/XCTest preflight
        run: |
          set -euo pipefail
          brew install xcodegen
          ./Scripts/check-macos.sh
      - name: Build-only unsigned Release simulator build
        if: inputs.mode == 'build-only'
        run: |
          set -euo pipefail
          xcodebuild -project WebKWeb.xcodeproj -scheme WebKWeb \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build
          echo 'Unsigned Release simulator build passed; no archive, signing, or upload.' >> "$GITHUB_STEP_SUMMARY"
      - name: Validate signing and install profiles
        if: inputs.mode == 'upload' && inputs.confirm_upload == 'UPLOAD'
        id: signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_WIDGET_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_PROVISIONING_PROFILE_BASE64 APPLE_WIDGET_PROVISIONING_PROFILE_BASE64; do
            if [[ -z "${!name:-}" ]]; then echo "::error::Missing $name"; exit 1; fi
          done
          umask 077
          mkdir -p "$RUNNER_TEMP/devntube-signing" "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/devntube-signing/distribution.p12"
          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/devntube-signing/app.mobileprovision"
          printf '%s' "$APPLE_WIDGET_PROVISIONING_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/devntube-signing/widget.mobileprovision"
          python3 Scripts/ci-signing.py \
            "$RUNNER_TEMP/devntube-signing/app.mobileprovision" \
            "$RUNNER_TEMP/devntube-signing/widget.mobileprovision" \
            "$RUNNER_TEMP/devntube-signing/distribution.p12" "$RUNNER_TEMP/devntube-signing"
          cp "$RUNNER_TEMP/devntube-signing/app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$(sed -n 's/^app_uuid=//p' "$GITHUB_OUTPUT").mobileprovision"
          cp "$RUNNER_TEMP/devntube-signing/widget.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$(sed -n 's/^widget_uuid=//p' "$GITHUB_OUTPUT").mobileprovision"
          keychain="$RUNNER_TEMP/devntube-signing/signing.keychain-db"
          security create-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security import "$RUNNER_TEMP/devntube-signing/distribution.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_CERTIFICATE_PASSWORD" "$keychain" >/dev/null
      - name: Archive and export signed IPA
        if: inputs.mode == 'upload' && inputs.confirm_upload == 'UPLOAD'
        env:
          APP_UUID: ${{ steps.signing.outputs.app_uuid }}
          WIDGET_UUID: ${{ steps.signing.outputs.widget_uuid }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/devntube-signing/signing.keychain-db"
          xcodebuild -project WebKWeb.xcodeproj -scheme WebKWeb \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DevnTube.xcarchive" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' \
            DEVELOPMENT_TEAM=HUN9MS832X \
            WEBKWEB_APP_PROFILE_UUID="$APP_UUID" WEBKWEB_WIDGET_PROFILE_UUID="$WIDGET_UUID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $keychain" archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/DevnTube.xcarchive" \
            -exportPath "$RUNNER_TEMP/devntube-export" \
            -exportOptionsPlist "$RUNNER_TEMP/devntube-signing/ExportOptions.plist"
          test -s "$RUNNER_TEMP/devntube-export/DevnTube.ipa" || \
            test -s "$RUNNER_TEMP/devntube-export/WebKWeb.ipa"
      - name: Upload to TestFlight using App Store Connect API key
        if: inputs.mode == 'upload' && inputs.confirm_upload == 'UPLOAD'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for name in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_BASE64; do
            if [[ -z "${!name:-}" ]]; then echo "::error::Missing $name"; exit 1; fi
          done
          umask 077
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -D > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          ipa="$RUNNER_TEMP/devntube-export/DevnTube.ipa"
          if [[ ! -s "$ipa" ]]; then ipa="$RUNNER_TEMP/devntube-export/WebKWeb.ipa"; fi
          test -s "$ipa"
          xcrun altool --upload-app --type ios --file "$ipa" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
      - name: Remove runner-local signing material
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/devntube-signing" ]]; then
            security delete-keychain "$RUNNER_TEMP/devntube-signing/signing.keychain-db" 2>/dev/null || true
            rm -rf "$RUNNER_TEMP/devntube-signing"
          fi
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${{ steps.signing.outputs.app_uuid }}.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/${{ steps.signing.outputs.widget_uuid }}.mobileprovision"
          rm -f "$HOME/.appstoreconnect/private_keys/"AuthKey_*.p8
