name: DevnTube TestFlight

# User explicitly stopped work. This workflow only cancels an older release run.
# No checkout, signing, tests, build, secrets, or upload.
on:
  push:
    branches: [codex/testflight-2026-10-16]
    paths: [.github/workflows/testflight.yml]

permissions: {}
concurrency:
  group: devntube-testflight
  cancel-in-progress: true

jobs:
  stopped:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Acknowledge user stop
        run: echo 'Stopped at user request. Release automation is disabled.'
