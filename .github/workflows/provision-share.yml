name: Authorized Share extension signing setup
on:
  push:
    branches: [codex/testflight-2026-10-16]
    paths: [.github/workflows/provision-share.yml, Scripts/provision-share.py]
permissions:
  contents: read
concurrency:
  group: devntube-share-provisioning
  cancel-in-progress: false
jobs:
  provision:
    runs-on: macos-26
    timeout-minutes: 12
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate project and prepare temporary signing identity
        run: |
          set -euo pipefail
          umask 077
          brew install xcodegen
          xcodegen generate
          mkdir -p "$RUNNER_TEMP/devntube-share-setup"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/devntube-share-setup/key.p8"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/devntube-share-setup/distribution.p12"
          keychain="$RUNNER_TEMP/devntube-share-setup/signing.keychain-db"
          security create-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$keychain"
          security set-keychain-settings -lut 1200 "$keychain"
          security unlock-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security import "$RUNNER_TEMP/devntube-share-setup/distribution.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_CERTIFICATE_PASSWORD" "$keychain" >/dev/null
      - name: Register extension and validate its App Store signing profile
        run: |
          set -euo pipefail
          export ASC_KEY_PATH="$RUNNER_TEMP/devntube-share-setup/key.p8"
          python3 Scripts/provision-share.py --bootstrap \
            --p12 "$RUNNER_TEMP/devntube-share-setup/distribution.p12" \
            --output "$RUNNER_TEMP/devntube-share-setup/share.mobileprovision"
      - name: Delete temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/devntube-share-setup/signing.keychain-db" || true
          rm -rf "$RUNNER_TEMP/devntube-share-setup"
