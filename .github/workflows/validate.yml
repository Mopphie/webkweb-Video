name: Native app verification

# The user explicitly authorized Actions on 2026-10-16.
# Tests this development branch without signing or submitting anything to Apple.
# Successful unsigned simulator builds and test results are kept as GitHub artifacts.
on:
  push:
    branches: [codex/commercial-use-cleanup, codex/playback-tab-ownership-2026-10-16]
    paths-ignore: ['Docs/**', '*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iPhone XCTest and Release build
    runs-on: macos-26
    # Full cold WebKit + iPhone UI + real iPad PiP/app-switch coverage.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Debug build and simulator tests
        id: debug
        run: ./Scripts/check-macos.sh
      - name: Release simulator build
        id: release
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          xcodebuild -project WebKWeb.xcodeproj -scheme WebKWeb \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build
      - name: Preserve unsigned simulator app
        if: always() && steps.release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: DevnTube-unsigned-simulator-app
          path: build/DerivedData/Build/Products/Release-iphonesimulator/*.app
          if-no-files-found: error
          retention-days: 7
      - name: Preserve native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-results
          path: build/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
