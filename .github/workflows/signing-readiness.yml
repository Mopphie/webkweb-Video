name: TestFlight signing readiness

on:
  push:
    branches: [codex/testflight-2026-10-16]
    paths: [.github/workflows/signing-readiness.yml]

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check presence of required signing configuration
        env:
          CERTIFICATE_PRESENT: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}
          CERTIFICATE_PASSWORD_PRESENT: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          APP_PROFILE_PRESENT: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 != '' }}
          WIDGET_PROFILE_PRESENT: ${{ secrets.APPLE_WIDGET_PROVISIONING_PROFILE_BASE64 != '' }}
          SHARE_PROFILE_PRESENT: ${{ secrets.APPLE_SHARE_PROVISIONING_PROFILE_BASE64 != '' }}
          ASC_KEY_ID_PRESENT: ${{ secrets.APP_STORE_CONNECT_KEY_ID != '' }}
          ASC_ISSUER_PRESENT: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID != '' }}
          ASC_KEY_PRESENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 != '' }}
        run: |
          set -euo pipefail
          missing=0
          for setting in CERTIFICATE_PRESENT CERTIFICATE_PASSWORD_PRESENT APP_PROFILE_PRESENT WIDGET_PROFILE_PRESENT SHARE_PROFILE_PRESENT ASC_KEY_ID_PRESENT ASC_ISSUER_PRESENT ASC_KEY_PRESENT; do
            if [[ "${!setting}" == true ]]; then
              echo "$setting: configured"
            else
              echo "::error::$setting: missing"
              missing=1
            fi
          done
          exit "$missing"
