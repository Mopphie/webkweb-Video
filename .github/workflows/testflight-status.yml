name: Inspect already uploaded TestFlight build
on:
  push:
    branches: [codex/testflight-status-2026-10-16]
    paths:
      - .github/workflows/testflight-status.yml
      - Scripts/app-store-connect.py
      - Scripts/Tests/test_app_store_connect.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read status of already uploaded build 7
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          export ASC_KEY_PATH="$RUNNER_TEMP/devntube-status.p8"
          trap 'rm -f "$ASC_KEY_PATH"' EXIT
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          Path(os.environ['ASC_KEY_PATH']).write_bytes(base64.b64decode(os.environ['APP_STORE_CONNECT_API_KEY_BASE64'], validate=True))
          PY
          # No previous-build argument: no group lookups/assignments, no POSTs.
          # This workflow neither builds/signs nor uploads another binary.
          python3 Scripts/app-store-connect.py verify --app-id 6822711093 --build-number 7 --timeout 600
      - name: Remove runner-local status key
        if: always()
        run: rm -f "$RUNNER_TEMP/devntube-status.p8"
