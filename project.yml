name: WebKWeb
options:
  developmentLanguage: de
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  WebKWeb:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist, WebKWeb.entitlements]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.mopphie.webkweb
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/WebKWeb.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
          # Same no-download binary for App Review and every end user.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WEBKWEB_NO_DOWNLOADS"
    dependencies:
      - target: FavoritesWidget
        embed: true
  FavoritesWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes: [Info.plist, FavoritesWidget.entitlements]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.mopphie.webkweb.favorites
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/FavoritesWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  WebKWebTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: ["*.test.cjs"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.mopphie.webkweb.tests
        GENERATE_INFOPLIST_FILE: YES
      configs:
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WEBKWEB_NO_DOWNLOADS"
    dependencies:
      - target: WebKWeb
schemes:
  WebKWeb:
    build:
      targets:
        WebKWeb: all
    test:
      targets: [WebKWebTests]
